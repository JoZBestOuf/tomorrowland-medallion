name: Relevé quotidien Tomorrowland

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
      timezone: "Europe/Paris"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tomorrowland-daily
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Effectuer le relevé
        env:
          MAGIC_EDEN_API_KEY: ${{ secrets.MAGIC_EDEN_API_KEY }}
        run: python tracker.py

      - name: Générer le tableau de bord
        run: python build_dashboard.py

      - name: Enregistrer les données et le site
        run: |
          git config user.name "Tomorrowland Tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data reports site
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
          else
            git commit -m "Relevé automatique $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l’artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Envoyer le rapport Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          MEDALLION_ALERT_SOL: "65"
          NFT_DROP_ALERT_PCT: "5"
          SPREAD_ALERT_PCT: "3"
        run: python notify_discord.py

  deploy:
    needs: tracker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
